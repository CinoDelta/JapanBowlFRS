<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Page</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <header class="page-header">
    <img class="title-banner" src="images/TitleBanner.png" alt="Japan Bowl FRS title banner">
  </header>

  <nav class="top-nav" aria-label="Primary navigation">
    <div class="nav-border nav-border-top"></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="singlePractice.html">Single Practice</a>
      <a href="deckCatalogue.html" class="active">Deck Catalogue
      </a>
      <a href="uploadDeck.html">Upload Deck</a>
    </div>
    <div class="nav-border nav-border-bottom"></div>
  </nav>

  <script src="PracticeJS/uploadDeck.js"></script>


  <main class="page-content-two">
    <div class="deck-header-row">
      <img class="sakura-image" src="images/sakura1.png" alt="sakura decorative left">
      <h2 id="deckSearchHeader">Public Deck List</h2>
      <img class="sakura-image" src="images/sakura1.png" alt="sakura decorative right">
    </div>
    <input 
      type="text"
      id="deckSearch"
      placeholder="Search the Catalogue..."
      onkeyup="filterList()"
    >
      



  </main>

  

      <select id="deckListOne" multiple size="1000" style="min-width: 15rem;" onchange="displayDeckInfo()">
        <option>
          Loading...
        </option>
        
      </select>

  
      <div id="deckList" style="background-color: #310c6c; border-color: rgb(129, 117, 255); color: #dda9ff;">
          <p id="thisDeckName" style="padding-left: 1rem; padding-right: 1rem; padding-top: .3rem; padding-bottom: .3rem;"> 
            <i>Deck Name: </i> <u>The Best To Ever Do It</u>
          </p>

          <p id="thisDeckCardCount" style="padding-left: 1rem; padding-right: 1rem; padding-top: .3rem; padding-bottom: .3rem;">
              <i>Card Count:</i> 1000 cards
          </p>

          <button id="singlePracticeSelect" style="color: rgb(255, 151, 153);">
            Single Practice!
          </button>

          <button id="hostTeamSelect" style="color: rgb(151, 168, 255);"">
            Host Team Match!
          </button>
      </div>




  <script src="PracticeJS/loadDeck.js"></script>
</body>
</html>
