<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Deck</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

  <nav class="top-nav" aria-label="Primary navigation">
    <div class="nav-border nav-border-top"></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="deckCatalogue.html">Deck Catalogue</a>
      <a href="uploadDeck.html"class="active">Upload Deck</a>
      <a href="login.html" id="auth-area">Sign In</a>
      <button id="sign-out-btn" style="display: none; padding-top: 0rem; padding-bottom: 0rem;" onclick="signOut()">Sign Out</button>
    <div class="nav-border nav-border-bottom"></div>
  </nav>

  <header class="page-header">
    <img class="title-banner" src="images/TitleBanner.png" alt="Japan Bowl FRS title banner">
  </header>

  
  
  
    <h2>Upload a Deck!</h2>
    

  <main class="page-content">

    <p style="text-align: center;"><b><u>Instructions:</u></b></p>
    
    <i>
    <ol>
      <li>Create a deck based on the template shown above</li>
      <li>Click the button below to upload</li>
      <li>You're done! (Files WILL be rejected if it is not the correct format or isn't a .json file.)</li>
    </ol>
    </i>
    
    <form id="uploadForm">
      <input  id="deckFile" name="Deck" type="file" accept="application/json,.json">
      <br> 
      <button id="uploadButton" type="Submit">Upload Deck</button>
    </form>

     <p style="text-align: center;" id="uploadStatus">Please choose a file.</p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="PracticeJS/supabaseclient.js"></script>

</body>
</html>
