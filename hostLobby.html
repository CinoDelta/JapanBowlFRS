<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Bowl FRS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

  <nav class="top-nav" aria-label="Primary navigation" style="display:none;"></nav>
  </nav>

  <header class="page-header" style="width: 50%; margin-bottom: 0.2rem; margin-top: 0.2rem;">
    <img class="title-banner" src="images/TitleBanner.png" alt="Japan Bowl FRS title banner">
  </header>



  <main class="page-content">
    <h2>
      Match Lobby

    </h2>
    
  </main>


  <div class="display-box" style="display: block; text-align:center; justify-content: center;">
    <div class="info-box"> 
              <h2 id="match-code" style="letter-spacing: 0.5rem;">------</h2>
              <p id="code-info"> 
               Please share this code with your players.
                </p>
    </div>

    <h3>Players</h3>

    <ol id="player-list" style="list-style-type: none; padding-left: 0;">

      <li>sansTheSkeleton@babies.com -- Team 1 -- Score: 0 pts</li>

    </ol>

    <button id="end-match-btn">End Match</button>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="PracticeJS/supabaseclient.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const matchCode = params.get('code');

    const codeEl = document.getElementById('match-code');
    const playerListEl = document.getElementById('player-list');
    const endMatchBtn = document.getElementById('end-match-btn');
    const info = document.getElementById('code-info');

    let matchId = null;

    function displayPlayers(players) {
      playerListEl.innerHTML = '';
      players.forEach(player => {
        const li = document.createElement('li');
        li.textContent = `${player.display_name} -- Team ${player.team_number} -- Score: ${player.score} pts`;

        playerListEl.appendChild(li);
      });
    }

    async function loadMatch() {
      const res = await fetch(`/api/matches?code=${matchCode}`);
      const data = await res.json();

      if (!data.ok) {
        codeEl.textContent = 'Match not found';
        return;
      }

      codeEl.textContent = data.match.code;

      displayPlayers(data.players);

      if (matchId === null) {
        matchId = data.match.id;
        

        // Ok listenng to real-time updates. we need to create a channel...


        supabaseClient
        .channel(`match-players-${matchId}`)
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'match_players', filter: 'match_players', filter: `match_id=eq.${matchId}` },
          () => {
            loadMatch(); // just call the function again bro
          }
        )
        .subscribe();
      }

      endMatchBtn.addEventListener('click', async () => {
        if (!matchId) return;

        const { data: { session } } = await supabase.auth.getSession();

        if (!session) {
          window.location.href = 'deckCatalogue.html';
          return;
        }

        const userId = session?.user?.id;

        let isHost = userId === data.match.host_user_id;
        
        
        if (isHost) {
          window.location.href = 'deckCatalogue.html';
          info.textContent = "Please share this code with your players."
          const res = await fetch(`/api/matches/?host_user_id=${matchId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`,
            },
          });

          endMatchBtn.textContent = 'Ending Match...';
          endMatchBtn.disabled = true;

          const data = await res.json();

          if (data.ok) {
            endMatchBtn.textContent = 'Match Ended Successfully';
            delay(1000).then(() => {
              window.location.href = 'index.html';
            });
            window.location.href = 'index.html';
          } else {
            alert('Only the host can end the match.');
            endMatchBtn.textContent = 'End Match';
            endMatchBtn.disabled = false;
          }
        } else {
          info.textContent = "Waiting for the host to start the match...";
          endMatchBtn.textContent = 'Leave Match';
          

         await fetch('/api/join', {
            method: 'DELETE', 
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({code: matchCode}),
          });

          window.location.href = 'deckCatalogue.html';
        
        }
      });

    }

    loadMatch();
  </script>

  <br>



  <br>







</body>
</html>
