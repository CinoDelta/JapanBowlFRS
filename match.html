<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Bowl FRS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

  <nav class="top-nav" aria-label="Primary navigation" style="display:none;"></nav>

  <header class="page-header" style="width: 50%; margin-bottom: 0.2rem; margin-top: 0.2rem;">
    <img class="title-banner" src="images/TitleBanner.png" alt="Japan Bowl FRS title banner">
  </header>

  <div class="game-box">

    <div id="teams-panel">
      <h2>TEAMS</h2>
      <div class="team-info">
        <h3 class="team-name">TEAM 1</h3>
        <ol class="player-list">
          <li>Loading...</li>
        </ol>
        <h3>TOTAL SCORE: 0</h3>
      </div>
    </div>

    <div class="game-panel">
        <img src="images/questionCorrect.png" class="match-top-image" id="correctImage" alt="" aria-hidden="true">
        <img src="images/questionwrong.png" class="match-top-image" id="wrongImage" alt="" aria-hidden="true">
      <div class="question-div" style="display:flex; justify-content:space-between; align-items:center; width:90%; margin-left: 5%; margin-right: 5%;">
        <img class="category-image" src="images/Category.png" alt="Category icon">
        <h2 id="current-category">CATEGORY: —</h2>
        <img id="answer-type-icon" src="images/Answer_Types/123.png" alt="Answer type icon">
      </div>

      <div class="question-div" style="justify-content: space-between;">
        <img class="category-image" src="images/sakura0.png" alt="Decoration">
        <h2 id="current-question">QUESTION:<br>—</h2>
        <img class="category-image" src="images/sakura0.png" alt="Decoration">
      </div>

      <p id="timer-display" style="display: block;">-- SECONDS LEFT</p>

      <div id="question-image-area">
        <img id="question-image" style="display:none;">
            <p id="no-image-text" style="display:block; text-align: center;">
                (No image provided)
            </p>
      </div>

      <div id="answer-area">
        <p id="result-banner" style="display:none; font-size: 2rem;"></p>
        <input id="answer-input" type="text" style="display:none;" placeholder="TYPE YOUR ANSWER HERE!">
        <button id="buzzer-btn">BUZZ!<span class="buzz-hint">or press Space</span></button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="PracticeJS/supabaseclient.js"></script>
  <script src="PracticeJS/readTiming.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const matchCode = params.get('code');

    // --- DOM refs ---
    const teamsPanel = document.getElementById('teams-panel');
    const categoryEl = document.getElementById('current-category');
    const questionEl = document.getElementById('current-question');
    const timerEl = document.getElementById('timer-display');
    const answerTypeIcon = document.getElementById('answer-type-icon');
    const questionImage = document.getElementById('question-image');
    const noImageText = document.getElementById('no-image-text');
    const buzzerBtn = document.getElementById('buzzer-btn');
    const answerInput = document.getElementById('answer-input');
    const resultBanner = document.getElementById('result-banner');
    const correctMaru = document.getElementById('correctImage');
    const incorrectBatsu = document.getElementById('wrongImage');
    const gamePanel = document.querySelector('.game-panel');

    // Restarts a CSS animation, even if its class is still on the element.
    function playAnim(el, className) {
        el.classList.remove(className);
        void el.offsetWidth; // forces the browser to notice the class was removed
        el.classList.add(className);
    }

    // Flashes the ◯ (correct) or ✕ (incorrect) stamp for 2 seconds. A new
    // stamp replaces one that is still showing and gets its own full 2
    // seconds, instead of being cut short by the old stamp's timer.
    let stampTimer = null;
    function flashStamp(stamp) {
        clearTimeout(stampTimer);
        correctMaru.classList.remove('flashing');
        incorrectBatsu.classList.remove('flashing');
        playAnim(stamp, 'flashing');
        stampTimer = setTimeout(() => stamp.classList.remove('flashing'), 2000);
    }

    // --- Sounds ---
    const correctSound = new Audio('sounds/correctJapanese.mp3');
    const earlySound = new Audio('sounds/gamesynthbeep01.mp3')
    const incorrectSound = new Audio('sounds/incorrectJapanese.mp3');
    const buzzerSound = new Audio('sounds/Buzzer.wav');

    // 頑張りましょう！ clips. One is picked at random each time.
    const ganbaruSounds = [
        'sounds/Ganbarus/GB.01.A-LittleWitchAcademia12_1_0.02.22.858-0.02.26.128.mp3',
        'sounds/Ganbarus/GB.02.Audio 1.mp3',
        'sounds/Ganbarus/GB.03.Audio 2.mp3',
        'sounds/Ganbarus/GB.04.Audio 3.mp3',
    ].map((src) => new Audio(encodeURI(src))); // encodeURI handles the spaces

    function playGanbaru() {
        const clip = ganbaruSounds[Math.floor(Math.random() * ganbaruSounds.length)];
        clip.currentTime = 0;
        clip.play().catch(() => {}); // browsers may block audio before a click
    }

    let soundBools = {
        "getReady": true
    }

    // Plays the incorrect sound and ✕ stamp. Each wrong answer only ever
    // plays it once (buzzKey), and two calls within 2.5 seconds count as one,
    // so the last wrong answer and "nobody got it" right after it don't
    // play the sound twice.
    const incorrectBuzzesPlayed = new Set();
    let lastIncorrectAt = 0;

    function buzzKey(questionIndex, userId) {
        return `${questionIndex}:${userId}`; // a player can only buzz once per question
    }

    function playIncorrect(key = null) {
        if (key) {
            if (incorrectBuzzesPlayed.has(key)) return;
            incorrectBuzzesPlayed.add(key);
        }
        if (Date.now() - lastIncorrectAt < 2500) return;
        lastIncorrectAt = Date.now();
        incorrectSound.currentTime = 0;
        incorrectSound.play().catch(() => {});
        flashStamp(incorrectBatsu);
    }

    const soundsVol = 0.7;
    let changeVolume = (sound) => {sound.volume = soundsVol};

    let clockOffset = 0;


    changeVolume(correctSound);
    changeVolume(incorrectSound);
    changeVolume(buzzerSound);

    const matchTheme = new Audio('sounds/teamMatch.ogg');
    const matchStart = new Audio('sounds/matchStart.ogg');

    // --- State ---
    let matchId = null;
    let myUserId = null;
    let myDisplayName = null;
    let currentQuestionIndex = null;

    // Timer phases: 'getready' -> 'reading' -> 'open' -> 'answering'
    let timerPhase = 'getready';
    let timerInterval = null;

    // Every timer is worked out from the clock, not by counting ticks, so a
    // tab the browser slowed down (hidden, phone screen locked) catches up
    // the moment it ticks again instead of falling behind everyone else.
    let currentQuestionText = '';
    let readTimeTotal = 0;
    let questionStartedAt = 0;      // server time the reading starts (ms)
    let isRereading = false;        // true after an early wrong answer restarted it
    let pausedSeconds = 0;          // time the clock stood still for buzzes
    let pauseStartedAt = null;      // server time the current buzz paused it

    let mainTimerTotal = 30;

    let answerEndsAt = 0;           // local time the answerer's 10s runs out
    let answerAutoSubmitTimeout = null;

    let myBuzzUsed = false;
    let answerSubmitted = false;
    // Set once the question has been settled (someone was right, everyone was
    // wrong, or time ran out) so the reveal and the advance only happen once.
    let questionOver = false;
    // How many people are in the match, so we can tell when every single
    // player has already buzzed and been graded on this question.
    let totalPlayerCount = 0;
    // Guards the end-of-match sequence, which is driven by a realtime event
    // that can fire more than once.
    let matchFinishHandled = false;
    let soundPlayedForBuzz = false;
    let soundPlayedForResult = false;
    let leaveToken = null;
    let staleBuzzCheck = null;

    // FIX #3: This flag is true from the moment the local user's
    // buzz POST succeeds until their answer is submitted/graded.
    // While true, checkBuzzStatus() skips all UI changes so that
    // a concurrent realtime-triggered re-check can't hide the
    // answer input out from under the user mid-typing.
    let iAmAnswering = false;


    // ---- BONUS STATE ----
    // null -> 'reading' -> 'open' -> 'timeup' -> 'done!'
    let bonusPhase = null;
    let bonusOnMyTeam = false;
    let bonusSubmitted = false;
    let bonusStartedAt = 0;
    let bonusEndsAt = 0;
    let bonusReadTime = 0;
    let myTeamNumber = null;

    // ---- HELPERS ----
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // The host picks the answer window in the lobby (settings.timeLimitSeconds,
    // 30 by default). Japanese answers take longer to type, so they get twice
    // whatever the host set rather than a hardcoded 60.
    function getMainTimerForAnswerType(answerType, baseSeconds) {
        const japaneseTypes = ['JP', 'ひら', 'カナ', '漢'];
        const base = Number(baseSeconds) > 0 ? Number(baseSeconds) : 30;
        return japaneseTypes.includes(answerType) ? base * 2 : base;
    }

    // Read-out timing lives in PracticeJS/readTiming.js, shared with the API so
    // the screen and the server agree on when reading ends. English reads a
    // word at a time, Japanese a character at a time.
    function getQuestionReadDuration(questionText) {
        return ReadTiming.getReadTime(questionText);
    }

    // "1", "1 and 2", "1, 2, and 3"
    function formatTeamList(teams) {
        if (teams.length === 1) return `${teams[0]}`;
        if (teams.length === 2) return `${teams[0]} and ${teams[1]}`;
        return `${teams.slice(0, -1).join(', ')}, and ${teams[teams.length - 1]}`;
    }

    function canBuzzNow() {
        return !myBuzzUsed
            && !questionOver
            && !iAmAnswering
            && (timerPhase === 'reading' || timerPhase === 'open');
    }
    function updateBuzzerVisibility() {
        const canBuzz = canBuzzNow();
        buzzerBtn.style.display = canBuzz ? 'block' : 'none';
        if (canBuzz) buzzerBtn.disabled = false;
    }

    // True once every player in the match has buzzed and been graded on this
    // question, i.e. nobody is left who could still get it.
    function everybodyHasBuzzed(buzzes) {
        if (!totalPlayerCount) return false;
        const graded = (buzzes || []).filter((b) => b.result !== null);
        return graded.length >= totalPlayerCount;
    }

    // Shows "LABEL:<line break>text". Question text comes from uploaded decks,
    // so it is inserted as plain text and can never be run as HTML.
    function setLabeledText(el, label, text) {
        el.replaceChildren(label, document.createElement('br'), text ?? '');
    }

    // ---- TEAMS PANEL ----
    function renderTeams(players) {
        const teamsMap = {};
        players.forEach((p) => {
            if (!teamsMap[p.team_number]) teamsMap[p.team_number] = [];
            teamsMap[p.team_number].push(p);
        });

        teamsPanel.innerHTML = '<h2>TEAMS</h2>';

        Object.keys(teamsMap).sort((a, b) => a - b).forEach((teamNum) => {
            const teamPlayers = teamsMap[teamNum];
            const totalScore = teamPlayers.reduce((sum, p) => sum + p.score, 0);
            const div = document.createElement('div');
            div.className = 'team-info';
            // Player names come from users, so build the list with
            // textContent rather than an HTML string.
            const teamName = document.createElement('h3');
            teamName.className = 'team-name';
            teamName.textContent = `TEAM ${teamNum}`;

            const playerList = document.createElement('ol');
            playerList.className = 'player-list';
            teamPlayers.forEach((p) => {
                const name = p.display_name.includes('@') ? p.display_name.split('@')[0] : p.display_name;
                const li = document.createElement('li');
                li.textContent = `${name} - Points: ${p.score}`;
                playerList.appendChild(li);
            });

            const total = document.createElement('h3');
            total.textContent = `TOTAL SCORE: ${totalScore}`;

            div.append(teamName, playerList, total);
            teamsPanel.appendChild(div);
        });
    }

    async function loadPlayers() {
        const res = await fetch(`/api/matches?code=${matchCode}`);
        const data = await res.json();
        if (!data.ok) return;
        matchId = data.match.id;
        totalPlayerCount = data.players.length;
        const me = data.players.find((p) => p.user_id === myUserId);
        myTeamNumber = me ? me.team_number : null;
        renderTeams(data.players);
    }

    // ---- TIMER ----

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        clearTimeout(answerAutoSubmitTimeout);
        answerAutoSubmitTimeout = null;
    }



    function serverNow() {
        return Date.now() + clockOffset;
    }

    // Seconds of the question that have played out: the time since it
    // started, minus the time it stood still while people answered.
    function questionElapsed() {
        const pausedSoFar = pauseStartedAt === null ? 0 : (serverNow() - pauseStartedAt) / 1000;
        return (serverNow() - questionStartedAt) / 1000 - pausedSeconds - pausedSoFar;
    }

    function phaseFromClock() {
        const elapsed = questionElapsed();
        if (elapsed < 0) return 'getready';
        if (elapsed < readTimeTotal) return 'reading';
        return 'open';
    }

    // The server's start time for the current question. A different time for
    // the same question means an early wrong answer restarted the reading,
    // and that restart is the question's new beginning for everyone.
    function applyQuestionStart(isoTime) {
        if (!isoTime) return;
        const startedAt = new Date(isoTime).getTime();
        if (startedAt === questionStartedAt) return;
        const isRestart = questionStartedAt !== 0;
        questionStartedAt = startedAt;
        pausedSeconds = 0;
        pauseStartedAt = null;
        if (isRestart) isRereading = true;
    }

    // One tick of the match clock. Safe to call any time; it works everything
    // out from the clock.
    function tick() {
        // Result screens, the bonus and the end of the match own the timer text.
        if (questionOver) return;

        if (timerPhase === 'answering') {
            // Once the answer is sent there is nothing left to count down.
            if (answerSubmitted) return;
            const left = Math.max(0, Math.ceil((answerEndsAt - Date.now()) / 1000));
            timerEl.style.color = '#ff6b6b';
            timerEl.textContent = `${left}s TO ANSWER`;
            return;
        }

        timerPhase = phaseFromClock();
        const elapsed = questionElapsed();

        if (timerPhase === 'getready') {
            timerEl.style.color = '#ffd54f';
            if (isRereading) {
                // An early wrong answer: everyone waits, then it starts over.
                timerEl.textContent = `RE-READING QUESTION IN ${Math.ceil(-elapsed)}...`;
                setLabeledText(questionEl, 'QUESTION:', '');
            } else {
                // The server sets the start a few seconds ahead so every
                // player's page is ready before the reading begins.
                if (soundBools.getReady === false) {
                    soundBools.getReady = true;
                    playGanbaru();
                }
                timerEl.textContent = `GET READY! ${Math.ceil(-elapsed)}`;
                questionEl.textContent = '頑張って！';
            }
        } else if (timerPhase === 'reading') {
            // English appears a word at a time and Japanese a character at a
            // time (see PracticeJS/readTiming.js for the timings).
            setLabeledText(questionEl, 'QUESTION:', ReadTiming.getRevealedText(currentQuestionText, elapsed));
            timerEl.style.color = 'red';
            timerEl.textContent = isRereading ? 'RE-READING QUESTION...' : 'QUESTION BEING READ OUT...';
        } else {
            soundBools.getReady = false; // so the next GET READY plays a ganbaru
            setLabeledText(questionEl, 'QUESTION:', currentQuestionText || '—');
            const left = Math.max(0, mainTimerTotal - (elapsed - readTimeTotal));
            const display = Math.ceil(left);
            timerEl.style.color = '#ffd54f';
            timerEl.textContent = `${display} SECOND${display === 1 ? '' : 'S'} LEFT`;
            if (left <= 0) revealAnswerAndAdvance();
        }

        // The buzzer follows the phase every tick, including for a page that
        // loaded straight into the middle of a question.
        updateBuzzerVisibility();
    }

    function startTimer() {
        stopTimer();
        tick();
        timerInterval = setInterval(tick, 250);
    }

    function enterAnswerPhase() {
        // The question's clock stands still while someone answers.
        if (pauseStartedAt === null && timerPhase !== 'getready') pauseStartedAt = serverNow();
        timerPhase = 'answering';
        answerEndsAt = Date.now() + 10000;
        updateBuzzerVisibility();

        clearTimeout(answerAutoSubmitTimeout);
        answerAutoSubmitTimeout = setTimeout(() => {
            if (!answerSubmitted && timerPhase === 'answering' && iAmAnswering) {
                submitAnswer();
            }
        }, 10000);

        clearTimeout(staleBuzzCheck);
        staleBuzzCheck = setTimeout(() => {
            if (timerPhase === 'answering' && !iAmAnswering) checkBuzzStatus();
        }, 16000);
    }

    function resumeOpenPhase() {
        clearTimeout(answerAutoSubmitTimeout);
        iAmAnswering = false;
        answerSubmitted = false;
        answerInput.style.display = 'none';
        answerInput.value = '';
        answerInput.disabled = false;
        // An early buzz hides the question; if it was a wrong early buzz, the
        // judge re-reads from the start for the remaining players.
        questionEl.style.display = 'block';
        resultBanner.style.display = 'none';

        // Add the time the clock stood still. (If the answer was an early
        // wrong one, the server restarted the question instead and
        // applyQuestionStart() has already cleared the pause.)
        if (pauseStartedAt !== null) {
            pausedSeconds += (serverNow() - pauseStartedAt) / 1000;
            pauseStartedAt = null;
        }

        timerPhase = phaseFromClock();
        tick(); // show the right phase straight away, not on the next tick
    }

    // Nobody got the question, so show the correct answer for 5 seconds and
    // then move the match on. The server only hands the answer over once the
    // question is genuinely over, so this can't be used to peek at it early.
    async function revealAnswerAndAdvance() {
        if (questionOver) return;
        questionOver = true;

        stopTimer();
        const questionAtReveal = currentQuestionIndex;

        updateBuzzerVisibility();
        answerInput.style.display = 'none';
        questionEl.style.display = 'block';

        timerEl.style.display = 'block';
        timerEl.style.color = '#ff6b6b';
        timerEl.textContent = "TIME'S UP!";

        if (!soundPlayedForResult) {
            soundPlayedForResult = true;
            playIncorrect(); // skipped if a wrong answer just played it
        }

        let answer = null;
        try {
            const res = await fetch(`/api/match?code=${matchCode}&reveal=1`);
            const data = await res.json();
            if (data.ok) answer = data.answer;
        } catch (e) {
            console.error('could not fetch the answer:', e);
        }

        if (questionAtReveal !== currentQuestionIndex) return;

        resultBanner.textContent = answer
            ? `NOBODY GOT IT — the answer was "${answer}"`
            : 'NOBODY GOT IT!';
        resultBanner.style.display = 'block';

        await delay(5000);

        // Somebody else's client may already have moved the match on.
        if (questionAtReveal !== currentQuestionIndex) return;
        
        for (let attempt = 0; attempt < 10; attempt ++) {
            if (questionAtReveal !== currentQuestionIndex) return;
            const result = await tryAdvance();
            const retryable = ['someone_still_answering', 'question_not_over'];
            if (!result || result.ok || !retryable.includes(result.error)) return;
            await delay(3000);
        }
    }

    // ---- PERIODIC TIMER SYNC ----
    // Every 15 seconds, re-fetch the server's start time for the question.
    // The timers already follow the clock; this catches a restart (an early
    // wrong answer) whose live update never arrived.
    async function refreshQuestionStart() {
        if (currentQuestionIndex === null) return;
        try {
            const res = await fetch(`/api/match?code=${matchCode}`);
            if (res.status === 404 && !matchFinishHandled) {
                window.location.href = 'index.html'; // the match is gone
                return;
            }
            const data = await res.json();
            if (data.ok && data.currentQuestionIndex === currentQuestionIndex) {
                applyQuestionStart(data.questionStartedAt);
            }
        } catch (e) {
            console.error('timer sync failed:', e); // transient; try again in 15s
        }
    }

    setInterval(refreshQuestionStart, 15000);

    // ---- QUESTION LOADING ----

    function resetQuestionUI() {
        myBuzzUsed = false;
        answerSubmitted = false;
        iAmAnswering = false;
        questionOver = false;
        soundPlayedForBuzz = false;
        soundPlayedForResult = false;
        bonusPhase = null;
        bonusOnMyTeam = false;
        bonusSubmitted = false;
        gamePanel.classList.remove('bonus-active');
        timerPhase = 'getready';
        buzzerBtn.disabled = false;
        answerInput.style.display = 'none';
        answerInput.value = '';
        answerInput.disabled = false;
        // An early buzz on the previous question hid this.
        questionEl.style.display = 'block';
        timerEl.style.display = 'block';
        resultBanner.style.display = 'none';
        updateBuzzerVisibility(); // hidden until get-ready ends
        stopTimer();
    }

    async function loadQuestion() {
        const sentAt = Date.now();
        const res = await fetch(`/api/match?code=${matchCode}`);
        const data = await res.json();

        if (!data.ok) return;

        if (data.serverNow) clockOffset = data.serverNow - (sentAt + Date.now()) / 2;

        if (data.status === 'finished') {
            // The realtime UPDATE that finishes the match can fire more than
            // once; without this the whole sequence would restart and stack up
            // return-to-catalogue timers.
            if (matchFinishHandled) return;
            matchFinishHandled = true;

            stopTimer();
            questionOver = true;
            categoryEl.textContent = 'MATCH FINISHED!';
            questionEl.style.display = 'block';
            questionEl.textContent = '';
            buzzerBtn.style.display = 'none';
            answerInput.style.display = 'none';
            resultBanner.style.display = 'none';
            timerEl.style.display = 'block';
            timerEl.style.color = '#ffd54f';
            timerEl.textContent = '';

            await delay(2000);

            const tyingTeams = data.tyingTeams || [];

            if (tyingTeams.length > 1) {
                questionEl.textContent = `After everything, there's still a tie for first!!`;
                await delay(2000);
                questionEl.textContent = `The tying teams for first are... `;
                await delay(2000);
                questionEl.textContent = `TEAMS ${formatTeamList(tyingTeams)}!!!`;
            } else if (data.winningTeam !== null && data.winningTeam !== undefined) {
                questionEl.textContent = `The winning team is...`;
                await delay(2000);
                questionEl.textContent = `TEAM ${data.winningTeam}!!!`;
            } else {
                questionEl.textContent = `Nobody scored a single point!`;
            }

            await delay(5000);

            let timeLeft = 10;
            timerEl.textContent = `Sending you back to the deck catalogue in ${timeLeft} seconds...`;

            const returnInterval = setInterval(async () => {
                timeLeft--;
                timerEl.textContent = `Sending you back to the deck catalogue in ${timeLeft} seconds...`;

                if (timeLeft <= 0) {
                    clearInterval(returnInterval);
                    const {data: { session }} = await supabaseClient.auth.getSession();
                    if (session) {
                        await fetch (`/api/matches/?code=${matchCode}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${session.access_token}`,
                            },
                        }).catch(() => {});
                    }
                    window.location.href = 'deckCatalogue.html';
                }
            }, 1000);
            return;
        }

        if (data.currentQuestionIndex !== currentQuestionIndex) {
            currentQuestionIndex = data.currentQuestionIndex;
            resetQuestionUI();

            currentQuestionText = data.question?.question ?? '—';
            readTimeTotal = getQuestionReadDuration(currentQuestionText);
            mainTimerTotal = getMainTimerForAnswerType(data.question?.answerType, data.timeLimitSeconds);
            questionStartedAt = 0; // a new question, so its start isn't a restart
            isRereading = false;
            applyQuestionStart(data.questionStartedAt);

            // tick() works out the phase from the clock, which also covers a
            // page that loads mid-question (e.g. a refresh).
            startTimer();
        } else {
            // Same question: the start time moves when an early wrong answer
            // restarts the reading for everyone.
            applyQuestionStart(data.questionStartedAt);
        }

        categoryEl.textContent = `CATEGORY: ${data.question?.category ?? '—'}`;

        if (data.question?.answerType) {
            answerTypeIcon.src = `images/Answer_Types/${data.question.answerType}.png`;
            answerTypeIcon.style.display = 'block';
        } else {
            answerTypeIcon.style.display = 'none';
        }

        if (data.question?.imgLink) {
            questionImage.src = data.question.imgLink;
            questionImage.style.display = 'block';
            noImageText.style.display = 'none';
        } else {
            questionImage.style.display = 'none';
            noImageText.style.display = 'block';
        }

        checkBuzzStatus();
    }

    // ---- BUZZ STATUS ----

    async function checkBuzzStatus() {
        if (currentQuestionIndex === null) return;

        // FIX #3: If the local user just buzzed and is actively typing
        // their answer, skip this entire function. Without this guard,
        // a realtime-triggered re-check can race ahead of the database
        // commit for the user's own buzz INSERT, see "no active buzz,"
        // and hide the answer input mid-typing.
        if (iAmAnswering) return;
        if (questionOver) return;

        const questionAtRequest = currentQuestionIndex;
        const res = await fetch(`/api/buzzer?code=${matchCode}&questionIndex=${questionAtRequest}`);
        const data = await res.json();
        if (!data.ok) return;

        // FIX: the match can advance while this request is in flight. Applying
        // the previous question's buzzes to the new one is what used to mark
        // the buzz as already used and hide the buzzer for a whole question.
        if (questionAtRequest !== currentQuestionIndex || iAmAnswering || questionOver) return;

        // Whether the local player still has their buzz is a fact about this
        // question, so read it off the server every time rather than latching
        // a flag that only a brand new question can ever clear.
        myBuzzUsed = (data.buzzes || []).some((b) => b.user_id === myUserId);

        // --- Someone got it correct ---
        if (data.answeredCorrectly) {
            const correctBuzz = data.buzzes.find((b) => b.result === 'correct');
            questionOver = true;
            answerInput.style.display = 'none';
            questionEl.style.display = 'block'; // an early buzz may have hidden it
            setLabeledText(questionEl, 'QUESTION:', currentQuestionText);
            timerEl.style.display = 'block';
            timerEl.style.color = '#ffd54f';
            timerEl.textContent = 'ANSWERED!'; // not a leftover answer countdown
            updateBuzzerVisibility();
            resultBanner.textContent = `${correctBuzz.displayName} says "${correctBuzz.guess}" — CORRECT!`;
            resultBanner.style.display = 'block';

            if (!soundPlayedForResult) {
                soundPlayedForResult = true;
                correctSound.play();
                flashStamp(correctMaru);
            }

            if (data.bonus) {
                // Leave the toss-up result up for a moment, then show the bonus.
                setTimeout(() => {
                    if (questionAtRequest === currentQuestionIndex) renderBonus(data.bonus);
                }, 2000);
                return;
            }

            setTimeout(tryAdvance, 2000);
            return;
        }

        // --- Someone is currently answering ---
        if (data.activeBuzz) {
            const isMe = data.activeBuzz.user_id === myUserId;
            buzzerBtn.style.display = 'none';

            if (!soundPlayedForBuzz) {
                soundPlayedForBuzz = true;
                buzzerSound.play();
                if (data.activeBuzz.is_early) {
                    earlySound.play();
                }
            }

            if (data.activeBuzz.is_early) {
                questionEl.style.display = 'none';
            } else {
                questionEl.style.display = 'block';
            }

            if (isMe && !answerSubmitted) {
                answerInput.style.display = 'block';
                answerInput.disabled = false;
                answerInput.placeholder = 'Type your answer...';
                timerEl.style.display = 'block';
                if (timerPhase !== 'answering') {
                    enterAnswerPhase();
                }
            } else if (!isMe) {
                answerInput.style.display = 'block';
                answerInput.disabled = true;
                timerEl.style.display = 'none'; // timer doesn't show when there is someone else answering
                answerInput.placeholder = `${data.activeBuzz.displayName} is answering...`;
                if (timerPhase !== 'answering') {
                    enterAnswerPhase();
                }
            } else {
              timerEl.style.display = 'block';
            }

            resultBanner.style.display = 'none';
            return;
        } else {
          timerEl.style.display = 'block';
          questionEl.style.display = 'block';
        }

        // --- No active buzz: check latest resolved ---
        const resolvedBuzzes = (data.buzzes || []).filter((b) => b.result !== null);
        if (resolvedBuzzes.length > 0) {
            const latest = resolvedBuzzes[resolvedBuzzes.length - 1];
            const latestKey = buzzKey(questionAtRequest, latest.user_id);

            // Already-shown wrong answers are skipped, so a later re-check
            // doesn't replay the sound and banner for the same answer.
            if (latest.result === 'incorrect' && !soundPlayedForResult && !incorrectBuzzesPlayed.has(latestKey)) {
                soundPlayedForResult = true;
                playIncorrect(latestKey);

                resultBanner.textContent = `${latest.displayName} says "${latest.guess}" — INCORRECT!`;
                resultBanner.style.display = 'block';

                // An early wrong answer restarts the question for everyone.
                // Fetch the new start now rather than waiting for the live
                // update, so the re-read lines up on every screen.
                if (latest.is_early) refreshQuestionStart();

                setTimeout(() => {
                    soundPlayedForBuzz = false;
                    soundPlayedForResult = false;

                    if (questionAtRequest !== currentQuestionIndex || questionOver) return;

                    if (timerPhase === 'answering') {
                        resumeOpenPhase();
                    } else {
                        // We never saw this buzz go live (the insert and the
                        // grade landed together), so the phase was never moved
                        // to 'answering' — clean up by hand instead of leaving
                        // the buzzer hidden for the rest of the question.
                        resultBanner.style.display = 'none';
                        questionEl.style.display = 'block';
                        updateBuzzerVisibility();
                    }

                    // Everyone has now had their go and nobody got it, so
                    // there is no point running the clock down.
                    if (everybodyHasBuzzed(data.buzzes)) revealAnswerAndAdvance();
                }, 2000);
                return;
            }

            // That wrong answer is still on screen (its 2 seconds aren't up),
            // so leave the banner alone; the timer above moves things on.
            if (latest.result === 'incorrect' && soundPlayedForResult) return;
        }

        // --- Everyone has buzzed and nobody got it ---
        if (everybodyHasBuzzed(data.buzzes)) {
            revealAnswerAndAdvance();
            return;
        }

        // --- Nobody buzzed yet, or we already processed the last incorrect ---
        answerInput.style.display = 'none';
        resultBanner.style.display = 'none';
        updateBuzzerVisibility();
    }

    // ---- SUBMITTING AN ANSWER ----

    async function submitAnswer() {
        if (answerSubmitted) return;
        if (!iAmAnswering) return; // the input is only live for the person who buzzed

        const guess = answerInput.value.trim() || '(no answer)';
        answerInput.disabled = true;
        answerSubmitted = true; // also stops the answer countdown in tick()
        clearTimeout(answerAutoSubmitTimeout);
        timerEl.style.color = '#ffd54f';
        timerEl.textContent = 'ANSWER LOCKED IN!';

        const { data: { session } } = await supabaseClient.auth.getSession();

        const res = await fetch('/api/buzzer', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ code: matchCode, questionIndex: currentQuestionIndex, guess }),
        });

        const data = await res.json();

        if (!data.ok) {
            // FIX #2: No alert — just log it and show in the result banner.
            console.error('Could not submit answer:', data.error);
            resultBanner.textContent = 'Error submitting answer.';
            resultBanner.style.display = 'block';
            resumeOpenPhase();
            checkBuzzStatus(); // re-check in case the server did accept it after all
            return;
        }

        answerInput.style.display = 'none';
        resultBanner.textContent = `${myDisplayName} says: "${guess}"`;
        resultBanner.style.display = 'block';

        await delay(2000);

        resultBanner.textContent = `That's ${data.result.toUpperCase()}!`;

        if (data.result === 'correct') {
            correctSound.play();
            flashStamp(correctMaru);
            iAmAnswering = false;
            questionOver = true;
            updateBuzzerVisibility();
            await delay(2000);

            if (data.bonusQuestion) {
                resultBanner.textContent = 'BONUS QUESTION!';
                await delay(1000);
                checkBonusStatus(); // fetches the bonus and shows it
            } else {
                tryAdvance();
            }
        } else {
            playIncorrect(buzzKey(currentQuestionIndex, myUserId));
            soundPlayedForBuzz = false;
            soundPlayedForResult = false;
            // An early wrong answer restarts the question for everyone; the
            // server sends the new start time with the result.
            applyQuestionStart(data.questionStartedAt);
            await delay(2000);
            resumeOpenPhase(); // this also sets iAmAnswering = false
            if (data.allWrong) revealAnswerAndAdvance(); // everyone has had their go and nobody got it
        }
    }

    // ---- ADVANCING ----

    async function tryAdvance() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;

        const res = await fetch('/api/match', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ code: matchCode }),
        });

        const data = await res.json();

        // FIX #2: No alert — just log failures silently. The server
        // rejects duplicate advances and "not resolved" attempts,
        // which are expected when multiple clients try at once.
        if (!data.ok) {
            console.log('advance rejected (normal if another client already advanced):', data.error);
        }

        return data;
    }

        // ---- BONUS QUESTIONS ----

    async function checkBonusStatus() {
        if (currentQuestionIndex === null) return;

        const questionAtRequest = currentQuestionIndex;
        const res = await fetch(`/api/buzzer?code=${matchCode}&questionIndex=${questionAtRequest}`);
        const data = await res.json();
        if (!data.ok || questionAtRequest !== currentQuestionIndex) return;

        if (data.bonus) renderBonus(data.bonus);
    }

    // Safe to call repeatedly: the first call sets up the screen, and later
    // calls only matter once the bonus is over.
    function renderBonus(bonus) {
        if (bonusPhase === 'done') return;

        if (bonusPhase === null) {
            bonusPhase = 'reading';
            bonusOnMyTeam = bonus.teamNumber === myTeamNumber;
            bonusSubmitted = false;
            bonusStartedAt = new Date(bonus.startedAt).getTime();
            bonusEndsAt = new Date(bonus.endsAt).getTime();
            bonusReadTime = bonus.readTime;

            timerPhase = 'bonus';
            questionOver = true;
            updateBuzzerVisibility();

            categoryEl.textContent = `BONUS QUESTION FOR TEAM ${bonus.teamNumber}!`;
            // Gold border while the bonus runs; finishBonus() takes it off.
            if (!bonus.over) gamePanel.classList.add('bonus-active');
            setLabeledText(questionEl, 'BONUS:', bonus.question);
            questionEl.style.display = 'block';
            if (bonus.answerType) {
                answerTypeIcon.src = `images/Answer_Types/${bonus.answerType}.png`;
                answerTypeIcon.style.display = 'block';
            }
            resultBanner.style.display = 'none';
            timerEl.style.display = 'block';

            answerInput.value = '';
            answerInput.style.display = 'block';
            answerInput.disabled = !bonusOnMyTeam;
            answerInput.placeholder = bonusOnMyTeam
                ? 'Answer the bonus with your team...'
                : `Team ${bonus.teamNumber} is answering the bonus...`;
            if (bonusOnMyTeam) answerInput.focus();

            startBonusTimer();
        }

        if (bonus.over) finishBonus(bonus);
    }

    // Runs on the same timerInterval as the main timer, so stopTimer() clears it too.
    function startBonusTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            if (bonusPhase === 'timeup' || bonusPhase === 'done') return;
            const now = Date.now() + clockOffset;

            if (now < bonusStartedAt) {
                timerEl.style.color = '#ffd54f';
                timerEl.textContent = `BONUS IN ${Math.ceil((bonusStartedAt - now) / 1000)}...`;
                return;
            }

            if (now < bonusStartedAt + bonusReadTime * 1000) {
                bonusPhase = 'reading';
                timerEl.style.color = 'red';
                timerEl.textContent = 'BONUS BEING READ OUT...';
                return;
            }

            bonusPhase = 'open';
            const remaining = Math.max(0, Math.ceil((bonusEndsAt - now) / 1000));
            timerEl.style.color = '#ffd54f';
            timerEl.textContent = `${remaining}s TO ANSWER THE BONUS`;

            if (now >= bonusEndsAt) bonusTimeUp();
        }, 250);
    }

    async function submitBonusAnswer() {
        if (!bonusOnMyTeam || bonusSubmitted || bonusPhase === 'done') return;

        const guess = answerInput.value.trim();
        if (!guess) return;

        bonusSubmitted = true;
        answerInput.disabled = true;

        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/api/buzzer', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ code: matchCode, questionIndex: currentQuestionIndex, guess, bonus: true }),
        });

        const data = await res.json();
        // A teammate beating you to it is expected, not an error.
        if (!data.ok && data.error !== 'bonus_already_answered') {
            console.error('Could not submit bonus answer:', data.error);
        }

        checkBonusStatus();
    }

    async function bonusTimeUp() {
        if (bonusPhase === 'timeup' || bonusPhase === 'done') return;
        bonusPhase = 'timeup';
        stopTimer();
        const questionAtTimeUp = currentQuestionIndex;

        timerEl.style.color = '#ff6b6b';
        timerEl.textContent = "TIME'S UP!";

        // Whatever the team had typed still counts.
        if (bonusOnMyTeam && !bonusSubmitted && answerInput.value.trim()) {
            await submitBonusAnswer();
        }
        answerInput.disabled = true;

        // Give the server's clock a moment to pass the deadline too, so it
        // hands the answer over.
        await delay(1500);

        const res = await fetch(`/api/buzzer?code=${matchCode}&questionIndex=${questionAtTimeUp}`);
        const data = await res.json();
        if (questionAtTimeUp !== currentQuestionIndex) return;
        finishBonus(data.bonus || {});
    }

    async function finishBonus(bonus) {
        if (bonusPhase === 'done') return;
        bonusPhase = 'done';
        stopTimer();
        const questionAtFinish = currentQuestionIndex;

        answerInput.style.display = 'none';
        timerEl.style.display = 'block';

        gamePanel.classList.remove('bonus-active'); // the bonus is over
        flashStamp(bonus.result === 'correct' ? correctMaru : incorrectBatsu);

        if (bonus.result === 'correct') {
            correctSound.currentTime = 0;
            correctSound.play().catch(() => {});
            timerEl.style.color = '#ffd54f';
            timerEl.textContent = 'BONUS CORRECT!';
            resultBanner.textContent = `${bonus.displayName} says "${bonus.guess}" — CORRECT! +${bonus.points} for TEAM ${bonus.teamNumber}`;
        } else if (bonus.result === 'incorrect') {
            timerEl.style.color = '#ff6b6b';
            timerEl.textContent = 'BONUS INCORRECT!';
            resultBanner.textContent = `${bonus.displayName} says "${bonus.guess}" — INCORRECT! The answer was "${bonus.answer}"`;
        } else {
            timerEl.style.color = '#ff6b6b';
            timerEl.textContent = "TIME'S UP!";
            resultBanner.textContent = bonus.answer
                ? `No bonus answer — it was "${bonus.answer}"`
                : 'No bonus answer!';
        }
        resultBanner.style.display = 'block';

        await delay(4000);

        // Somebody else's client may already have moved the match on.
        if (questionAtFinish !== currentQuestionIndex) return;
        tryAdvance();
    }

    // ---- BUZZER CLICK ----

    let buzzInFlight = false;

    async function buzzNowNowNow() {
        // Holding space fires keydown repeatedly; only one buzz request at a time.
        if (buzzInFlight || !canBuzzNow()) return;

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            resultBanner.textContent = 'Please sign in first.';
            resultBanner.style.display = 'block';
            return;
        }

        // Respond the instant the button is pressed instead of after the
        // round trip; rolled back below if the server turns the buzz down.
        buzzInFlight = true;
        buzzerBtn.disabled = true;
        buzzerSound.currentTime = 0;
        buzzerSound.play().catch(() => {});
        soundPlayedForBuzz = true;

        let data;
        try {
            const res = await fetch('/api/buzzer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${session.access_token}`,
                },
                body: JSON.stringify({ code: matchCode }),
            });
            data = await res.json();
        } catch (e) {
            data = { error: 'network_error' };
        } finally {
            buzzInFlight = false;
        }

        // Someone else's buzz already explains the sound we played; any other
        // rejection means no buzz happened, so let the next real one play.
        if (!data.ok && data.error !== 'someone_answering') soundPlayedForBuzz = false;

        if (data.ok) {
            myBuzzUsed = true;
            iAmAnswering = true; // FIX #3: guard against checkBuzzStatus overrides
            updateBuzzerVisibility();
            answerInput.style.display = 'block';
            answerInput.disabled = false;
            answerInput.placeholder = 'Type your answer...';
            answerInput.focus();

            if (data.buzz?.is_early) {
                earlySound.play();
            }

            enterAnswerPhase();
        } else if (data.error === 'already_buzzed') {
            myBuzzUsed = true;
            updateBuzzerVisibility();
            checkBuzzStatus();
        } else if (data.error === 'someone_answering') {
            // Someone else is currently answering — keep the buzzer
            // visible but disabled briefly, then re-enable. The
            // realtime buzz update will call checkBuzzStatus() once
            // that person's answer is graded.
            buzzerBtn.disabled = false;
        } else {
            buzzerBtn.disabled = false;
            console.error('buzz failed:', data.error);
        }
    }

    buzzerBtn.addEventListener('click', buzzNowNowNow);

    // ---- SPACE TO BUZZ ----

    window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && event.target !== answerInput) {
            event.preventDefault();
            buzzNowNowNow();
        }
    });

    // ---- ENTER KEY TO SUBMIT ----

    answerInput.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        if (bonusPhase === 'reading' || bonusPhase === 'open') submitBonusAnswer();
        else submitAnswer();
    });

    // ---- INIT ----

    async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        leaveToken = session.access_token;

        supabaseClient.auth.onAuthStateChange((_event, newSession) =>{
            leaveToken = newSession?.access_token ?? null;
        });
        myUserId = session.user.id;
        myDisplayName = session.user.user_metadata?.full_name ?? session.user.email;

    
        //matchStart.play(); bring this back one day?

        //matchTheme.loop = true;
        //matchTheme.play().catch((err) => {
        //    console.warn('Autoplay failed:', err);
        //});

        await loadPlayers();
        await loadQuestion();

        supabaseClient
            .channel(`match-players-${matchId}`)
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'match_players', filter: `match_id=eq.${matchId}` },
                () => loadPlayers()
            )
            .subscribe();

        supabaseClient
            .channel(`match-state-${matchId}`)
            .on('postgres_changes',
                { event: 'UPDATE', schema: 'public', table: 'matches', filter: `id=eq.${matchId}` },
                () => loadQuestion()
            )
            .subscribe();

        supabaseClient
            .channel(`match-buzzes-${matchId}`)
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'buzzes', filter: `match_id=eq.${matchId}` },
                () => (bonusPhase !== null ? checkBonusStatus() : checkBuzzStatus())
            )
            .subscribe();
    }

    init();

    window.addEventListener('pagehide', (event) => {
        if (event.persisted) return; // page is being cached, not unloaded
        if(!leaveToken || matchFinishHandled) return;

        fetch('api/join', {
            method: 'DELETE',
            keepalive: true,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${leaveToken}`,
            },
            body: JSON.stringify({ code: matchCode }),
        });
    });
  </script>
